# GitHub Pages - אתר סטטי בינה מלאכותית ללימוד
# Workflow חדש: בונה תיקיית פרסום נקייה ומעלה ל-Pages

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site folder
        run: |
          mkdir -p _site _site/en _site/ar _site/hi _site/ru
          cp index.html index-en.html index-ar.html index-hi.html index-ru.html _site/
          cp search.html search-en.html search-ar.html search-hi.html search-ru.html _site/
          cp privacy.html privacy-en.html privacy-ar.html privacy-hi.html privacy-ru.html _site/
          cp accessibility.html accessibility-en.html accessibility-ar.html accessibility-hi.html accessibility-ru.html _site/
          cp terms.html terms-en.html terms-ar.html terms-hi.html terms-ru.html _site/
          cp style.css script.js a11y.js _site/
          cp -r pages _site/
          cp -r images _site/
          cp en/index.html _site/en/
          cp ar/index.html _site/ar/
          cp hi/index.html _site/hi/
          cp ru/index.html _site/ru/
          touch _site/.nojekyll
          ls -la _site
          ls -la _site/pages | head -40

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
